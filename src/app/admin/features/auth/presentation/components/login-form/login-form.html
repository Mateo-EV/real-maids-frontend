<form class="login-form" aria-label="Sign in form">
  <div class="field-group">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" />
  </div>

  <div class="field-group">
    <div class="field-heading">
      <label for="password">Password</label>
      <button class="text-button" type="button">Forgot password?</button>
    </div>
    <input id="password" name="password" type="password" autocomplete="current-password"
      placeholder="Enter your password" />
  </div>

  <label class="remember-option" for="remember">
    <input id="remember" name="remember" type="checkbox" />
    <span>Remember me on this device</span>
  </label>

  <button class="submit-button" type="button">Sign in <span aria-hidden="true">↗</span></button>

  <div class="divider" aria-hidden="true"><span>or continue with</span></div>

  <button class="secondary-button" type="button">
    <span class="google-mark" aria-hidden="true">G</span>
    Continue with Google
  </button>
</form>
