<main class="min-h-dvh bg-background">
  <header class="border-b bg-card/90 px-4 py-3 backdrop-blur sm:px-8">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4">
      <div class="flex min-w-0 items-center gap-3">
        <span
          class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-secondary text-secondary-foreground"
        >
          <ng-icon name="lucideSparkles" aria-hidden="true" />
        </span>
        <div class="min-w-0">
          <p class="truncate font-semibold tracking-tight">The Real Maids</p>
          <p class="text-xs text-muted-foreground">Portal de operaciones</p>
        </div>
      </div>

      <button hlmBtn variant="ghost" size="sm" type="button" (click)="logout()">
        <ng-icon name="lucideLogOut" aria-hidden="true" />
        Cerrar sesión
      </button>
    </div>
  </header>

  <section class="mx-auto flex max-w-6xl items-center px-4 py-12 sm:px-8 sm:py-20">
    <section hlmCard class="w-full max-w-2xl shadow-sm">
      <div hlmCardHeader>
        <span
          class="mb-3 flex size-11 items-center justify-center rounded-xl bg-muted text-foreground"
        >
          <ng-icon name="lucideShieldCheck" aria-hidden="true" />
        </span>
        <p class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">
          Acceso confirmado
        </p>
        <h1 hlmCardTitle class="text-2xl tracking-tight">Bienvenido, {{ session()?.name }}</h1>
        <p hlmCardDescription class="max-w-prose leading-6">
          Desde aquí podrás gestionar la operación y acceder a las herramientas disponibles para tu
          rol.
        </p>
      </div>

      <div hlmCardContent>
        <div class="rounded-lg bg-muted p-4">
          <p class="text-xs font-medium uppercase tracking-wider text-muted-foreground">
            Usuario activo
          </p>
          <p class="mt-1 font-medium">{{ session()?.email }}</p>
        </div>
      </div>

      <div hlmCardFooter class="flex-wrap justify-end gap-3">
        <a hlmBtn routerLink="/admin/users">Administración de usuarios</a>
        <button hlmBtn type="button" variant="outline" (click)="logout()">
          <ng-icon name="lucideLogOut" aria-hidden="true" />
          Cerrar sesión
        </button>
      </div>
    </section>
  </section>
</main>
