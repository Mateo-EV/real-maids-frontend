<main
  class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-background px-4 py-10"
>
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -right-24 -top-24 size-72 rounded-full bg-primary/10 blur-3xl"></div>
    <div class="absolute -bottom-32 left-1/4 size-80 rounded-full bg-accent/15 blur-3xl"></div>
  </div>

  <div class="relative flex w-full max-w-md flex-col gap-6">
    <div class="flex items-center gap-3">
      <span
        class="flex size-10 items-center justify-center rounded-xl bg-secondary text-secondary-foreground shadow-sm"
      >
        <ng-icon name="lucideShieldCheck" aria-hidden="true" />
      </span>
      <div class="min-w-0">
        <p class="font-semibold tracking-tight">The Real Maids</p>
        @if (email(); as account) {
          <p class="truncate text-xs text-muted-foreground">Sesión de {{ account }}</p>
        } @else {
          <p class="text-xs text-muted-foreground">Operaciones y servicios</p>
        }
      </div>
    </div>

    <app-change-password-form (changed)="onChanged()" />

    <div class="flex flex-col gap-3">
      <p class="text-center text-xs leading-5 text-muted-foreground">
        Mientras no cambies la contraseña provisional no podrás usar el resto de la aplicación.
      </p>
      <button
        hlmBtn
        type="button"
        variant="outline"
        class="w-full"
        data-sign-out
        (click)="signOut()"
      >
        <ng-icon name="lucideLogOut" aria-hidden="true" />
        Cerrar sesión
      </button>
    </div>
  </div>
</main>
