<header class="sticky top-0 z-30 border-b border-[#1e2b48]/10 bg-white/95 backdrop-blur">
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-4 py-3 sm:px-6"
  >
    <a
      href="/"
      class="flex items-center gap-2 text-lg font-semibold tracking-tight text-[#2f6b3a]"
      aria-label="The Real Maids home"
    >
      <span aria-hidden="true" class="text-2xl text-[#e0a23b]">✿</span>
      <span>The Real <span class="italic">Maids</span></span>
    </a>

    <nav
      aria-label="Main"
      class="order-3 flex w-full items-center gap-6 overflow-x-auto text-sm font-semibold sm:order-none sm:w-auto"
    >
      @for (item of nav; track item.key) {
        <a
          [attr.href]="item.href"
          [attr.aria-current]="active() === item.key ? 'page' : null"
          class="shrink-0 border-b-2 py-2 transition hover:text-[#f4695c]"
          [class.border-[#f4695c]]="active() === item.key"
          [class.text-[#f4695c]]="active() === item.key"
          [class.border-transparent]="active() !== item.key"
          [class.text-[#1e2b48]]="active() !== item.key"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <a
      [attr.href]="contactHref"
      class="inline-flex min-h-11 shrink-0 items-center rounded-full border border-[#1e2b48] px-5 text-sm font-semibold text-[#1e2b48] transition hover:bg-[#1e2b48] hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#f4695c]"
    >
      Call {{ contactPhone }}
    </a>
  </div>
</header>
